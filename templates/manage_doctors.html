<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Doctors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .action-buttons .btn {
            min-width: 80px;
        }
        #loadingSpinner {
            display: none;
        }
    </style>
</head>
<body class="bg-light">
{% if 'user' not in session %}
  <script>window.location.href="/login";</script>
{% endif %}
    <div class="container py-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <div class="d-flex justify-content-between align-items-center">
                    <h2 class="h4 mb-0">Manage Doctors</h2>
                    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#doctorModal" onclick="resetDoctorForm()">
                        <i class="bi bi-plus-lg"></i> Add Doctor
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="doctorTable">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Specialty</th>
                                <th>Email</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="doctorsTableBody">
                            <!-- Doctors will be loaded here -->
                        </tbody>
                    </table>
                    <div id="loadingSpinner" class="text-center my-4">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                    <div id="noDoctorsMessage" class="alert alert-info d-none">
                        No doctors found. Add your first doctor above.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Doctor Modal -->
    <div class="modal fade" id="doctorModal" tabindex="-1" aria-labelledby="doctorModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="doctorForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="doctorModalLabel">Add Doctor</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="doctorId">
                        <div class="mb-3">
                            <label for="doctorName" class="form-label">Doctor Name *</label>
                            <input type="text" class="form-control" id="doctorName" required>
                        </div>
                        <div class="mb-3">
                            <label for="doctorSpecialty" class="form-label">Specialty *</label>
                            <input type="text" class="form-control" id="doctorSpecialty" required>
                        </div>
                        <div class="mb-3">
                            <label for="doctorEmail" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="doctorEmail" required>
                        </div>
                        <div id="formError" class="alert alert-danger d-none"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="saveDoctorBtn">
                            <span id="saveButtonText">Save</span>
                            <span id="saveButtonSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script>

        const API_BASE_URL = window.location.origin;
        const DOCTORS_API_URL = `${API_BASE_URL}/api/doctors`;

        // DOM Elements
        const doctorsTableBody = document.getElementById('doctorsTableBody');
        const doctorForm = document.getElementById('doctorForm');
        const doctorModal = new bootstrap.Modal(document.getElementById('doctorModal'));
        const loadingSpinner = document.getElementById('loadingSpinner');
        const noDoctorsMessage = document.getElementById('noDoctorsMessage');
        const formError = document.getElementById('formError');

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            fetchDoctors();
        });

        // Fetch all doctors
        async function fetchDoctors() {
            try {
                showLoading(true);
                const response = await fetch(DOCTORS_API_URL);

                if (!response.ok) {
                    throw new Error('Failed to fetch doctors');
                }

                const doctors = await response.json();
                renderDoctors(doctors);
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to load doctors. Please try again.');
            } finally {
                showLoading(false);
            }
        }

        // Render doctors in the table
        function renderDoctors(doctors) {
            doctorsTableBody.innerHTML = '';

            if (doctors.length === 0) {
                noDoctorsMessage.classList.remove('d-none');
                return;
            }

            noDoctorsMessage.classList.add('d-none');

            doctors.forEach(doctor => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${doctor.name}</td>
                    <td>${doctor.specialty}</td>
                    <td>${doctor.email}</td>
                    <td class="text-end action-buttons">
                        <button class="btn btn-sm btn-warning me-2"
                            onclick="openEditModal('${doctor._id}', '${escapeHtml(doctor.name)}', '${escapeHtml(doctor.specialty)}', '${escapeHtml(doctor.email)}')">
                            Edit
                        </button>
                        <button class="btn btn-sm btn-danger"
                            onclick="confirmDeleteDoctor('${doctor._id}')">
                            Delete
                        </button>
                    </td>
                `;
                doctorsTableBody.appendChild(row);
            });
        }

        // Reset form for adding new doctor
        function resetDoctorForm() {
            document.getElementById('doctorId').value = '';
            document.getElementById('doctorName').value = '';
            document.getElementById('doctorSpecialty').value = '';
            document.getElementById('doctorEmail').value = '';
            document.getElementById('doctorModalLabel').textContent = 'Add Doctor';
            formError.classList.add('d-none');
        }

        // Open modal for editing doctor
        function openEditModal(id, name, specialty, email) {
            document.getElementById('doctorId').value = id;
            document.getElementById('doctorName').value = name;
            document.getElementById('doctorSpecialty').value = specialty;
            document.getElementById('doctorEmail').value = email;
            document.getElementById('doctorModalLabel').textContent = 'Edit Doctor';
            formError.classList.add('d-none');
            doctorModal.show();
        }

        // Confirm before deleting
        function confirmDeleteDoctor(id) {
            if (confirm('Are you sure you want to delete this doctor?')) {
                deleteDoctor(id);
            }
        }

        // Delete doctor
        async function deleteDoctor(id) {
            try {
                showLoading(true);
                const response = await fetch(`${DOCTORS_API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete doctor');
                }

                await fetchDoctors();
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to delete doctor. Please try again.');
            } finally {
                showLoading(false);
            }
        }

        // Handle form submission
        doctorForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('doctorId').value;
            const name = document.getElementById('doctorName').value.trim();
            const specialty = document.getElementById('doctorSpecialty').value.trim();
            const email = document.getElementById('doctorEmail').value.trim();

            // Basic validation
            if (!name || !specialty || !email) {
                showError('Please fill in all required fields');
                return;
            }

            if (!isValidEmail(email)) {
                showError('Please enter a valid email address');
                return;
            }

            formError.classList.add('d-none');
            const saveButtonText = document.getElementById('saveButtonText');
            const saveButtonSpinner = document.getElementById('saveButtonSpinner');

            try {
                // Show loading state in button
                saveButtonText.textContent = 'Saving...';
                saveButtonSpinner.classList.remove('d-none');

                const doctorData = {
                    name: name,
                    specialty: specialty,
                    email: email
                };

                let response;
                if (id) {
                    // Update existing doctor
                    response = await fetch(`${DOCTORS_API_URL}/${id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(doctorData)
                    });
                } else {
                    // Add new doctor
                    response = await fetch(DOCTORS_API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(doctorData)
                    });
                }

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to save doctor');
                }

                // Refresh the doctors list
                await fetchDoctors();

                // Close the modal
                doctorModal.hide();
            } catch (error) {
                console.error('Error:', error);
                showError(error.message);
            } finally {
                // Reset button state
                saveButtonText.textContent = 'Save';
                saveButtonSpinner.classList.add('d-none');
            }
        });

        // Helper functions
        function showLoading(show) {
            if (show) {
                loadingSpinner.style.display = 'block';
            } else {
                loadingSpinner.style.display = 'none';
            }
        }

        function showError(message) {
            formError.textContent = message;
            formError.classList.remove('d-none');
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function isValidEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }
    </script>
</body>
</html>
