<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Virtual Health Assistant</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">Virtual Health Assistant</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/register">Register</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container">
    <div class="login-container mt-5 p-4 shadow rounded bg-white" style="max-width: 400px; margin: auto;">
      <h2 class="mb-3 text-center">Login</h2>
      {% if message %}<div class="alert alert-success">{{ message }}</div>{% endif %}
      <form id="loginForm">
        <input type="text" id="username" name="username" class="form-control mb-2" placeholder="Username" required>
        <input type="password" id="password" name="password" class="form-control mb-3" placeholder="Password" required>
        <button type="submit" class="btn btn-primary w-100">Login</button>
        <div id="loginError" class="text-danger mt-2"></div>
      </form>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').onsubmit = async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = '/manage-doctors';
      } else {
        document.getElementById('loginError').textContent = data.error || 'Login failed';
      }
    };
  </script>
</body>
</html>
